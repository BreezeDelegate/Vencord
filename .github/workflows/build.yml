name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml

permissions:
    contents: write

env:
    FORCE_COLOR: true

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build Vencord
              run: pnpm build --standalone

            - name: Generate official plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Verify custom plugin is bundled
              shell: bash
              run: |
                  set -euo pipefail
                  test -f src/userplugins/voiceMessageBooster/index.ts
                  test -s dist/renderer.js
                  grep -Fq 'VoiceMessageBooster' dist/renderer.js
                  echo 'VoiceMessageBooster is present in dist/renderer.js'

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Get release hash
              run: echo "release_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

            - name: Upload verified DevBuild release
              if: github.repository == 'BreezeDelegate/Vencord'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}
              run: |
                  set -euo pipefail
                  if ! gh release view devbuild >/dev/null 2>&1; then
                      gh release create devbuild \
                          --target "$GITHUB_SHA" \
                          --title "DevBuild $RELEASE_TAG" \
                          --notes "Verified Vencord devbuild with BreezeDelegate custom plugins." \
                          --latest
                  fi
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild \
                      --target "$GITHUB_SHA" \
                      --title "DevBuild $RELEASE_TAG" \
                      --notes "Verified Vencord devbuild with VoiceMessageBooster bundled." \
                      --latest

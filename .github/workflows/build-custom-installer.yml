name: Build Custom Vencord Installer

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build-custom-installer.yml
    workflow_run:
        workflows:
            - Build DevBuild
        types:
            - completed

permissions:
    contents: write

concurrency:
    group: breeze-vencord-installer
    cancel-in-progress: true

env:
    FORCE_COLOR: true
    UPSTREAM_INSTALLER_REF: v1.4.0
    BUILD_RELEASE_API: https://api.github.com/repos/BreezeDelegate/Vencord/releases/tags/breeze-runtime
    INSTALLER_RELEASE_API: https://api.github.com/repos/BreezeDelegate/Vencord/releases/tags/installer
    INSTALLER_DOWNLOAD_BASE: https://github.com/BreezeDelegate/Vencord/releases/download/installer/

jobs:
    BuildInstaller:
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: windows-latest

        steps:
            - name: Clone known-good official installer source
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  git clone --depth 1 --branch $env:UPSTREAM_INSTALLER_REF https://github.com/Vencord/Installer.git installer
                  if ($LASTEXITCODE -ne 0) { throw "Unable to clone Vencord Installer $env:UPSTREAM_INSTALLER_REF" }

                  Push-Location installer
                  $resolvedRef = git describe --tags --exact-match HEAD
                  if ($LASTEXITCODE -ne 0 -or $resolvedRef.Trim() -ne $env:UPSTREAM_INSTALLER_REF) {
                      throw "Expected Vencord Installer $env:UPSTREAM_INSTALLER_REF, got $resolvedRef"
                  }
                  Write-Host "Using known-good upstream installer: $resolvedRef"
                  Pop-Location

            - name: Point installer exclusively to BreezeDelegate releases
              shell: pwsh
              working-directory: installer
              run: |
                  $ErrorActionPreference = "Stop"

                  $constantsPath = Join-Path $PWD "constants.go"
                  $constants = Get-Content $constantsPath -Raw
                  $constants = $constants.Replace(
                      'const ReleaseUrl = "https://api.github.com/repos/Vendicated/Vencord/releases/latest"',
                      'const ReleaseUrl = "${{ env.BUILD_RELEASE_API }}"'
                  )
                  $constants = $constants.Replace(
                      'const ReleaseUrlFallback = "https://vencord.dev/releases/vencord"',
                      'const ReleaseUrlFallback = "${{ env.BUILD_RELEASE_API }}"'
                  )
                  $constants = $constants.Replace(
                      'const InstallerReleaseUrl = "https://api.github.com/repos/Vencord/Installer/releases/latest"',
                      'const InstallerReleaseUrl = "${{ env.INSTALLER_RELEASE_API }}"'
                  )
                  $constants = $constants.Replace(
                      'const InstallerReleaseUrlFallback = "https://vencord.dev/releases/installer"',
                      'const InstallerReleaseUrlFallback = "${{ env.INSTALLER_RELEASE_API }}"'
                  )
                  $constants = $constants.Replace(
                      'var UserAgent = "VencordInstaller/" + buildinfo.InstallerGitHash + " (https://github.com/Vencord/Installer)"',
                      'var UserAgent = "BreezeVencordInstaller/" + buildinfo.InstallerGitHash + " (https://github.com/BreezeDelegate/Vencord)"'
                  )
                  Set-Content $constantsPath $constants -Encoding UTF8

                  $selfUpdaterPath = Join-Path $PWD "self_updater.go"
                  $selfUpdater = Get-Content $selfUpdaterPath -Raw
                  $selfUpdater = $selfUpdater.Replace(
                      'const BaseUrl = "https://github.com/Vencord/Installer/releases/latest/download/"',
                      'const BaseUrl = "${{ env.INSTALLER_DOWNLOAD_BASE }}"'
                  )
                  $selfUpdater = $selfUpdater.Replace(
                      '"VencordInstallerCli.exe", "VencordInstaller.exe"',
                      '"BreezeVencordInstaller.exe", "BreezeVencordInstaller.exe"'
                  )
                  Set-Content $selfUpdaterPath $selfUpdater -Encoding UTF8

                  $downloaderPath = Join-Path $PWD "github_downloader.go"
                  $downloader = Get-Content $downloaderPath -Raw
                  $pattern = 'func installLatestBuilds\(\) \(retErr error\) \{\r?\n'
                  $replacement = @'
                  func installLatestBuilds() (retErr error) {
                      Log.Debug("Installing latest builds...")

                      requiredAssets := map[string]bool{
                          "patcher.js": false,
                          "preload.js": false,
                          "renderer.js": false,
                          "renderer.css": false,
                      }
                      for _, asset := range ReleaseData.Assets {
                          if _, required := requiredAssets[asset.Name]; required {
                              requiredAssets[asset.Name] = true
                          }
                      }
                      for name, present := range requiredAssets {
                          if !present {
                              return fmt.Errorf("Breeze Vencord build release is incomplete: missing %s", name)
                          }
                      }
                  '@
                  $patchedDownloader = [regex]::Replace(
                      $downloader,
                      $pattern,
                      ($replacement.TrimStart() + "`n"),
                      1
                  )
                  if ($patchedDownloader -eq $downloader) {
                      throw "Unable to add runtime asset validation to github_downloader.go"
                  }
                  Set-Content $downloaderPath $patchedDownloader -Encoding UTF8

                  $constantsCheck = Get-Content $constantsPath -Raw
                  $selfUpdaterCheck = Get-Content $selfUpdaterPath -Raw
                  $downloaderCheck = Get-Content $downloaderPath -Raw

                  if ($constantsCheck -notmatch [regex]::Escape('${{ env.BUILD_RELEASE_API }}')) {
                      throw "The Breeze runtime API was not patched"
                  }
                  if ($constantsCheck -notmatch [regex]::Escape('${{ env.INSTALLER_RELEASE_API }}')) {
                      throw "The installer release API was not patched"
                  }
                  if ($selfUpdaterCheck -notmatch [regex]::Escape('${{ env.INSTALLER_DOWNLOAD_BASE }}')) {
                      throw "The installer download URL was not patched"
                  }
                  if ($downloaderCheck -notmatch 'Breeze Vencord build release is incomplete') {
                      throw "The runtime asset guard was not patched"
                  }

            - name: Install MSYS2
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  choco install msys2 --yes --no-progress
                  if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install MSYS2" }

                  $roots = @("C:\tools\msys64", "C:\msys64")
                  $root = $roots |
                      Where-Object { Test-Path (Join-Path $_ "usr\bin\bash.exe") } |
                      Select-Object -First 1
                  if (-not $root) { throw "MSYS2 bash.exe was not found after installation" }

                  "MSYS2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Build graphical installer
              shell: pwsh
              working-directory: installer
              run: |
                  $ErrorActionPreference = "Stop"
                  $bash = Join-Path $env:MSYS2_ROOT "usr\bin\bash.exe"
                  if (-not (Test-Path $bash)) { throw "MSYS2 bash is unavailable: $bash" }

                  $windowsPath = (Resolve-Path $PWD).Path.Replace("\", "/")
                  $script = @'
                  set -euo pipefail
                  cd "$(cygpath -u '__INSTALLER_PATH__')"
                  pacman -Sy --noconfirm --needed \
                      git \
                      mingw-w64-x86_64-gcc \
                      mingw-w64-x86_64-SDL2 \
                      mingw-w64-x86_64-go \
                      mingw-w64-x86_64-pkgconf
                  export PATH=/mingw64/bin:/usr/bin:$PATH
                  export GOROOT=/mingw64/lib/go
                  export GOPATH=/mingw64
                  go get -v
                  go install github.com/tc-hib/go-winres@latest
                  go-winres make --product-version "git-tag"
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags static -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'vencordinstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'vencordinstaller/buildinfo.InstallerTag=installer'" -o BreezeVencordInstaller.exe
                  '@
                  $script = $script.Replace('__INSTALLER_PATH__', $windowsPath)

                  & $bash -lc $script
                  if ($LASTEXITCODE -ne 0) {
                      throw "Installer compilation failed with exit code $LASTEXITCODE"
                  }

            - name: Verify graphical installer
              shell: pwsh
              working-directory: installer
              run: |
                  $ErrorActionPreference = "Stop"
                  $file = "BreezeVencordInstaller.exe"
                  if (-not (Test-Path $file -PathType Leaf)) {
                      throw "Missing executable: $file"
                  }
                  $size = (Get-Item $file).Length
                  if ($size -lt 500000) {
                      throw "Executable looks incomplete: $file ($size bytes)"
                  }
                  Write-Host "${file}: $size bytes"

            - name: Publish clean installer release
              shell: pwsh
              working-directory: installer
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $ErrorActionPreference = "Stop"
                  $repo = "BreezeDelegate/Vencord"

                  gh release view installer --repo $repo *> $null
                  $installerExists = $LASTEXITCODE -eq 0
                  if (-not $installerExists) {
                      gh release create installer `
                          --repo $repo `
                          --target $env:GITHUB_SHA `
                          --title "Breeze Vencord Installer" `
                          --notes "Installer for BreezeDelegate/Vencord. It downloads the verified breeze-runtime release." `
                          --latest
                      if ($LASTEXITCODE -ne 0) {
                          throw "Unable to create the installer release"
                      }
                  }

                  $assets = gh release view installer `
                      --repo $repo `
                      --json assets `
                      --jq '.assets[].name'
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to list existing installer assets"
                  }
                  foreach ($asset in $assets) {
                      if ($asset) {
                          gh release delete-asset installer $asset `
                              --repo $repo `
                              --yes
                          if ($LASTEXITCODE -ne 0) {
                              throw "Unable to delete stale installer asset: $asset"
                          }
                      }
                  }

                  gh release upload installer `
                      BreezeVencordInstaller.exe `
                      --repo $repo `
                      --clobber
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to upload BreezeVencordInstaller.exe"
                  }

                  $releaseId = gh api "repos/$repo/releases/tags/installer" --jq '.id'
                  if ($LASTEXITCODE -ne 0 -or -not $releaseId) {
                      throw "Unable to resolve the installer release ID"
                  }

                  gh api --method PATCH "repos/$repo/releases/$releaseId" `
                      -f name="Breeze Vencord Installer" `
                      -f body="Installer for BreezeDelegate/Vencord. Runtime source: breeze-runtime. Upstream installer pinned to v1.4.0 while Vencord issue #4607 affects v1.4.1. VoiceMessageBooster and ProfileLocationWidget are verified before every runtime publication." `
                      -F prerelease=false `
                      -f make_latest=true *> $null
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to mark the installer release as latest"
                  }

                  $assetCount = gh release view installer `
                      --repo $repo `
                      --json assets `
                      --jq '.assets | length'
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to verify installer release assets"
                  }
                  if ([int]$assetCount -ne 1) {
                      throw "Installer release must contain exactly one asset, found $assetCount"
                  }

                  gh release view devbuild --repo $repo *> $null
                  $obsoleteDevbuildExists = $LASTEXITCODE -eq 0
                  if ($obsoleteDevbuildExists) {
                      gh release delete devbuild --repo $repo --cleanup-tag --yes
                      if ($LASTEXITCODE -ne 0) {
                          Write-Warning "Could not remove obsolete devbuild release; this does not affect the installer."
                      }
                  }

                  Write-Host "Installer release published successfully with exactly one asset."
                  exit 0

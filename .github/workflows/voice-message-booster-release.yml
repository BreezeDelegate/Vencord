name: Build VoiceMessageBooster Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/userplugins/voiceMessageBooster/**"
      - "release/voice-message-booster/**"
      - ".github/workflows/voice-message-booster-release.yml"

permissions:
  contents: write

concurrency:
  group: voice-message-booster-release
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable repository pnpm version
        shell: pwsh
        run: |
          corepack enable
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          corepack prepare $package.packageManager --activate
          node --version
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Vencord with updater disabled
        shell: pwsh
        run: pnpm build --disable-updater

      - name: Package installable ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $PWD "release-output"
          $packageRoot = Join-Path $output "VoiceMessageBooster-Vencord"
          $packageDist = Join-Path $packageRoot "dist"

          Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDist | Out-Null

          $distFiles = @("patcher.js", "preload.js", "renderer.js", "renderer.css")
          foreach ($file in $distFiles) {
            $source = Join-Path $PWD ("dist\" + $file)
            if (-not (Test-Path $source)) { throw "Build file missing: $source" }
            Copy-Item $source -Destination $packageDist -Force
          }

          Copy-Item "release\voice-message-booster\Installer.cmd" -Destination $packageRoot -Force
          Copy-Item "release\voice-message-booster\install.ps1" -Destination $packageRoot -Force
          Copy-Item "release\voice-message-booster\README.txt" -Destination $packageRoot -Force

          $hashes = [ordered]@{}
          foreach ($file in $distFiles) {
            $relative = "dist/$file"
            $hashes[$relative] = (Get-FileHash (Join-Path $packageDist $file) -Algorithm SHA256).Hash
          }

          $manifest = [ordered]@{
            product = "VoiceMessageBooster"
            sourceRepository = $env:GITHUB_REPOSITORY
            sourceCommit = $env:GITHUB_SHA
            builtAtUtc = [DateTime]::UtcNow.ToString("o")
            files = $hashes
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $packageRoot "manifest.json") -Encoding UTF8

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $zipName = "VoiceMessageBooster-Vencord-$shortSha-windows.zip"
          $zipPath = Join-Path $output $zipName
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $checksumPath = Join-Path $output ($zipName + ".sha256.txt")
          "$zipHash  $zipName" | Set-Content $checksumPath -Encoding ASCII

          @"
          VoiceMessageBooster custom Vencord build

          Source commit: $env:GITHUB_SHA

          Installation:
          1. Download and extract $zipName
          2. Run Installer.cmd
          3. Enable VoiceMessageBooster in Discord > Settings > Vencord > Plugins

          Git, Node.js and pnpm are not required on the destination PC.
          The Vencord updater is disabled in this custom build so the private plugin is not overwritten.
          "@ | Set-Content (Join-Path $output "release-notes.md") -Encoding UTF8

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMessageBooster-Vencord-${{ steps.package.outputs.short_sha }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "voice-message-booster-${{ steps.package.outputs.short_sha }}"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Unable to replace existing release $tag" }
          }

          gh release create $tag `
            "${{ steps.package.outputs.zip_path }}#VoiceMessageBooster Windows installer" `
            "${{ steps.package.outputs.checksum_path }}#SHA-256 checksum" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "VoiceMessageBooster ${{ steps.package.outputs.short_sha }}" `
            --notes-file "release-output\release-notes.md" `
            --latest
